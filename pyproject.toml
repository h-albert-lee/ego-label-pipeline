[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "egoownership"
version = "0.1.0"
description = "Benchmark scaffolding for Egocentric Implicit Ownership: scene filtering, sparse-frame extraction, and semi-automatic labeling over Ego4D FHO / EPIC-KITCHENS / HD-EPIC."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AIM Intelligence" }]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "tqdm>=4.66",
    "requests>=2.31",
]

[project.optional-dependencies]
frames = ["imageio[ffmpeg]>=2.34", "opencv-python>=4.9"]
detect = [
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.45",
    "pillow>=10.2",
    "accelerate>=0.30",
]
ram = ["transformers>=4.45"]
remote-anthropic = ["anthropic>=0.40", "pillow>=10.2"]
remote-openai = ["openai>=1.50", "pillow>=10.2"]
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.4", "httpx>=0.27"]

[project.scripts]
egoown = "egoownership.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
egoownership = ["configs/*.yaml", "server/static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
